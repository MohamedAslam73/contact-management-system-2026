<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #111827;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .add-btn {
            margin-top: 18px;
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background: #f59e0b;
        }

        .delete-btn {
            background: #dc2626;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty-message {
            text-align: center;
            padding: 20px;
            color: #6b7280;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Contact Management System</h1>

    <!-- Add Contact -->
    <div class="card">

        <h2>Add New Contact</h2>

        <form id="contactForm">

            <div class="form-grid">

                <input
                    type="text"
                    id="contactId"
                    placeholder="Contact ID (e.g. C001)"
                    required
                >

                <input
                    type="text"
                    id="name"
                    placeholder="Name"
                    required
                >

                <input
                    type="tel"
                    id="phone"
                    placeholder="10-digit Phone Number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

            </div>

            <button type="submit" class="add-btn">
                Add Contact
            </button>

            <div id="message"></div>

        </form>

    </div>


    <!-- Contact List -->
    <div class="card">

        <h2>Contact List</h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Contact ID</th>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="contactTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const contactForm = document.getElementById("contactForm");
const contactTableBody = document.getElementById("contactTableBody");
const message = document.getElementById("message");


// ===============================
// LOAD ALL CONTACTS
// ===============================

async function loadContacts() {
message.textContent = "";

    try {

        const response = await fetch("/api/contacts");

        const contacts = await response.json();

        contactTableBody.innerHTML = "";

        if (contacts.length === 0) {

            contactTableBody.innerHTML = `
                <tr>
                    <td colspan="5" class="empty-message">
                        No contacts available
                    </td>
                </tr>
            `;

            return;
        }

        contacts.forEach(contact => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${contact.contactId}</td>
                <td>${contact.name}</td>
                <td>${contact.phone}</td>
                <td>${contact.email}</td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editContact('${contact.contactId}')">
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteContact('${contact.contactId}')">
                        Delete
                    </button>

                </td>
            `;

            contactTableBody.appendChild(row);

        });

    } catch (error) {

        console.error("Error loading contacts:", error);

    }
}


// ===============================
// ADD CONTACT
// ===============================

contactForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const contact = {

        contactId: document.getElementById("contactId").value.trim(),

        name: document.getElementById("name").value.trim(),

        phone: document.getElementById("phone").value.trim(),

        email: document.getElementById("email").value.trim()

    };


    try {

        const response = await fetch("/api/contacts", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(contact)

        });


        const data = await response.json();


        if (!response.ok) {

            message.textContent = data.error || "Failed to add contact.";

            message.style.color = "red";

            return;
        }


        message.textContent = "Contact added successfully!";

        message.style.color = "green";


        contactForm.reset();

        loadContacts();


    } catch (error) {

        console.error(error);

        message.textContent = "Unable to connect to server.";

        message.style.color = "red";

    }

});


// ===============================
// EDIT CONTACT
// ===============================

async function editContact(contactId) {

    const name = prompt("Enter new name:");

    if (name === null || name.trim() === "") {
        return;
    }


    const phone = prompt("Enter new 10-digit phone number:");

    if (phone === null || phone.trim() === "") {
        return;
    }


    try {

        const response = await fetch(`/api/contacts/${contactId}`, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                name: name.trim(),

                phone: phone.trim()

            })

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.error || "Failed to update contact.");

            return;

        }


       alert("Contact updated successfully!");

message.textContent = "";

loadContacts();


    } catch (error) {

        console.error(error);

        alert("Unable to connect to server.");

    }

}


// ===============================
// DELETE CONTACT
// ===============================

async function deleteContact(contactId) {

    const confirmation = confirm(
        "Are you sure you want to delete this contact?"
    );


    if (!confirmation) {
        return;
    }


    try {

        const response = await fetch(`/api/contacts/${contactId}`, {

            method: "DELETE"

        });


        const data = await response.json();


        if (!response.ok) {

            alert(data.error || "Failed to delete contact.");

            return;

        }


       alert("Contact deleted successfully!");

message.textContent = "";

loadContacts();


    } catch (error) {

        console.error(error);

        alert("Unable to connect to server.");

    }

}


// ===============================
// LOAD CONTACTS WHEN PAGE OPENS
// ===============================

loadContacts();

</script>

</body>
</html>
